[package]
name = "polyspec-http-negotiate"
description = "Media ranges and Accept of HTTP, and the weight of each candidate media type"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
# The package holds the interface contract of the bindings beside the source, so that a repository that depends on
# this crate reads the contract from the package that Cargo resolved (bindgen design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_http_negotiate"
path = "src/lib.rs"

[dependencies]
polyspec-http-media-type = { path = "../../../http-media-type/packages/rust" }

[dev-dependencies]
serde_json = "1"
proptest = "1"

[lints]
workspace = true
