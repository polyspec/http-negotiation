[package]
name = "polyspec-http-negotiation"
description = "Media ranges and Accept of HTTP, and the weight of each candidate media type"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
# The package holds the interface contract of the bindings beside the source, so that a repository that depends on
# this crate reads the contract from the package that Cargo resolved (binding design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_http_negotiation"
path = "src/lib.rs"

[features]
# G-5, X-1: compiles the arming of the fault injection points of `fault`; a generated binding crate turns it on for its
# tests only, and a release build never does (binding design 3.6).
fault-test = ["polyspec-binding-core/fault-test"]

[dependencies]
# The kind interface that the generated bindings read from the core error (binding design E-1, E-3, I-2 (3)). The Git
# source is the tag of a release of binding; Cargo.lock pins its commit, the same binding_core as the generated binding
# crates and the tool of package.json.
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.9" }
# The media type grammar and its parameter values (NG-2, MT-3, MT-5). A Git dependency on the tag of the release 0.0.1
# of http-media-type; Cargo.lock pins its commit, so the build never reads another checkout's working tree (S15).
polyspec-http-media-type = { git = "https://github.com/polyspec/http-media-type.git", tag = "v0.0.5" }

[dev-dependencies]
serde_json = "1"
# tests/contracts.rs arms the fault injection points of the cases that name them, as a generated binding test does. A
# point is live only with the feature fault-test of this crate (binding GN-5), so the tests depend on the crate itself
# with that feature, and `cargo test` turns it on for them alone.
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.9", features = ["fault-test"] }
polyspec-http-negotiation = { path = ".", features = ["fault-test"] }
proptest = "1"

[lints]
workspace = true
