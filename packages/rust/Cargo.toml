[package]
name = "polyspec-http-negotiation"
description = "Media ranges and Accept of HTTP, and the weight of each candidate media type"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
# The package holds the interface contract of the bindings beside the source, so that a repository that depends on
# this crate reads the contract from the package that Cargo resolved (bindgen design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_http_negotiation"
path = "src/lib.rs"

[dependencies]
# The kind interface that the generated bindings read from the core error (bindgen design E-1, E-3, I-2 (3)). The Git
# source is the bindgen repository on the branch that every repository uses; Cargo.lock pins its commit, the same
# bindgen_core as the generated binding crates.
polyspec-bindgen-core = { git = "https://github.com/polyspec/bindgen.git", branch = "v1/rust-core" }
# The media type grammar and its parameter values (NG-2, MT-3, MT-5). Like bindgen_core, a Git dependency on the branch
# that every repository uses until it is released; Cargo.lock pins its commit, so the build never reads another
# checkout's working tree (S15).
polyspec-http-media-type = { git = "https://github.com/polyspec/http-media-type.git", branch = "v1/rust-core" }

[dev-dependencies]
serde_json = "1"
proptest = "1"

[lints]
workspace = true
